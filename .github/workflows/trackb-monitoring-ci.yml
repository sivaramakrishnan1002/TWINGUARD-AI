name: Track B monitoring and CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12 Track B checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.8
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-trackb.txt
      - name: Install pinned project and Track B dependencies
        run: >-
          python -m pip install -r requirements.txt -r requirements-trackb.txt
          "psycopg[binary]==3.3.6"
      - name: Compile Track B and AI service modules
        run: python -m compileall -q pipelines/trackb services/ai-service/app
      - name: Run focused Track B and AI service tests
        run: python -m pytest -q --import-mode=importlib tests/trackb tests/ai_service

  backend:
    name: Java 21 backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: services/backend/pom.xml
      - name: Run backend Maven tests
        run: mvn -B -ntp -f services/backend/pom.xml test

  config:
    name: Workflow and Prometheus configuration validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/trackb-monitoring-ci.yml", aliases: true)'
      - name: Validate Prometheus configuration
        run: |
          cat infra/monitoring/prometheus.yml | docker run --rm -i --pull=missing --entrypoint /bin/sh prom/prometheus:v3.13.2 -c 'cat > /tmp/prometheus.yml && promtool check config /tmp/prometheus.yml'
