name: twinguard-b11

services:
  frontend:
    image: local/twinguard-b11-frontend:0.1.0
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GATE_G0_STATUS: ${TWINGUARD_G0_STATUS:-unknown}
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    stop_grace_period: 10s

  ai-service:
    image: local/twinguard-b11-ai:0.1.0
    pull_policy: never
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./data/features/impact/batch2_v4_contract
        target: /app/data/features/impact/batch2_v4_contract
        read_only: true
      - type: bind
        source: ./data/features/routing/results/batch2_v1/revision_3
        target: /app/data/features/routing/results/batch2_v1/revision_3
        read_only: true
      - type: bind
        source: ./data/features/visualization3d/batch2_v1
        target: /app/data/features/visualization3d/batch2_v1
        read_only: true
      - type: bind
        source: ./data/features/forecast/batch2_v1
        target: /app/data/features/forecast/batch2_v1
        read_only: true
      - type: bind
        source: ./data/features/simulation/batch2_v1
        target: /app/data/features/simulation/batch2_v1
        read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app/services/ai-service
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    stop_grace_period: 10s

  backend:
    image: local/twinguard-b11-backend:0.1.0
    pull_policy: never
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: "8080"
      TWINGUARD_SCENARIO_PROJECT_ROOT: /app
      TWINGUARD_B13_ENABLED: "true"
      TWINGUARD_B13_AI_BASE_URL: http://ai-service:8000
    volumes:
      - type: bind
        source: ./data/features/visualization3d/batch2_v1
        target: /app/data/features/visualization3d/batch2_v1
        read_only: true
      - type: bind
        source: ./data/features/forecast/batch2_v1
        target: /app/data/features/forecast/batch2_v1
        read_only: true
      - type: bind
        source: ./data/features/simulation/batch2_v1
        target: /app/data/features/simulation/batch2_v1
        read_only: true
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; response=$$(cat <&3); [[ $${response} == *200* && $${response} == *UP* ]]"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    stop_grace_period: 20s
