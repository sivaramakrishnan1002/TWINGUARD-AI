services:
  trackb-redis:
    image: ${TRACKB_REDIS_IMAGE:-redis:8.10.2-alpine}
    profiles: [trackb]
    command: ["redis-server", "--save", "60", "1"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: [trackb-redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  trackb-kafka:
    image: ${TRACKB_KAFKA_IMAGE:-apache/kafka:4.3.2}
    profiles: [trackb]
    mem_limit: 768m
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@trackb-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [trackb-kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 15s
      timeout: 5s
      retries: 10
  trackb-prometheus:
    image: ${TRACKB_PROMETHEUS_IMAGE:-prom/prometheus:v3.13.2}
    profiles: [trackb]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - trackb-prometheus-data:/prometheus
      - ./services/trackb/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
  trackb-grafana:
    image: ${TRACKB_GRAFANA_IMAGE:-grafana/grafana:13.2.2-ubuntu}
    profiles: [trackb]
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - trackb-grafana-data:/var/lib/grafana
      - ./services/trackb/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/trackb/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  trackb-redis-data:
  trackb-kafka-data:
  trackb-prometheus-data:
  trackb-grafana-data:
