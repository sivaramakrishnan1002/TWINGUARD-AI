        "description": "C4 v1 / CR-008. The B08 runtime performs an exact, read-only lookup in the registered A07 V4 artifact by (run_id, valid_at, scenario_key). A unique saved result returns the unchanged C7 body (source_mode SIMULATED); unknown keys return 404 and duplicate/corrupt artifact state fails closed with 503. No recomputation, live source, or database access is performed.",
