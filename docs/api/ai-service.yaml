{
  "openapi": "3.1.0",
  "info": {"title": "TwinGuard AI Service", "version": "0.1.0", "description": "Design-only contract for flood forecasts, uncertainty, impacts, routing and scenario evaluation. Endpoints are not implemented yet."},
  "paths": {
    "/health": {"get": {"operationId": "health", "summary": "Report process health", "responses": {"200": {"description": "Service is available", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Health"}}}}}}},
    "/layers": {"get": {"operationId": "listLayers", "summary": "List registered read-only spatial layers", "responses": {"200": {"description": "Layer metadata from the read-only catalogue", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Layer"}}}}}, "503": {"$ref": "#/components/responses/Unavailable"}}}},
    "/forecast": {"post": {"operationId": "createForecast", "summary": "Create a versioned forecast run", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ForecastRequest"}}}}, "responses": {"202": {"description": "Forecast accepted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunAccepted"}}}}, "422": {"$ref": "#/components/responses/InvalidRequest"}}}},
    "/uncertainty": {"post": {"operationId": "summarizeUncertainty", "summary": "Return uncertainty summaries for a run and time", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunTimeRequest"}}}}, "responses": {"200": {"description": "Uncertainty summary", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UncertaintyResponse"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}},
    "/impact": {"post": {"operationId": "estimateImpact", "summary": "Summarize exposed population and affected assets", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunTimeRequest"}}}}, "responses": {"200": {"description": "Impact summary with provenance", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ImpactResponse"}}}}}}},
    "/route": {"post": {"operationId": "planRoute", "summary": "Evaluate a time-specific route against accessibility probabilities", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RouteRequest"}}}}, "responses": {"200": {"description": "Route candidate result", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RouteResponse"}}}}, "422": {"$ref": "#/components/responses/InvalidRequest"}}}},
    "/scenario": {"post": {"operationId": "createScenario", "summary": "Create a what-if scenario from a known state run", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ScenarioRequest"}}}}, "responses": {"202": {"description": "Scenario accepted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RunAccepted"}}}}}}}
  },
  "components": {
    "responses": {"Unavailable": {"description": "Required read-only data service unavailable"}, "NotFound": {"description": "Run or requested time not found"}, "InvalidRequest": {"description": "Request validation failed"}},
    "schemas": {
      "Health": {"type": "object", "required": ["status", "service"], "properties": {"status": {"type": "string", "enum": ["ok"]}, "service": {"type": "string"}, "database": {"type": "string", "enum": ["ok", "unavailable", "not_checked"]}}},
      "Layer": {"type": "object", "required": ["layer_key", "source_layer", "target_srid", "loaded_row_count"], "properties": {"layer_key": {"type": "string"}, "source_layer": {"type": "string"}, "target_srid": {"type": "integer"}, "loaded_row_count": {"type": "integer", "minimum": 0}}},
      "ForecastRequest": {"type": "object", "required": ["event_key", "issued_at", "horizon_hours", "step_minutes"], "properties": {"event_key": {"type": "string"}, "issued_at": {"type": "string", "format": "date-time"}, "horizon_hours": {"type": "integer", "minimum": 1}, "step_minutes": {"type": "integer", "minimum": 1}, "input_source_ids": {"type": "array", "items": {"type": "string"}}}},
      "RunTimeRequest": {"type": "object", "required": ["run_id", "valid_at"], "properties": {"run_id": {"type": "integer"}, "valid_at": {"type": "string", "format": "date-time"}, "zone_ids": {"type": "array", "items": {"type": "string"}}}},
      "RunAccepted": {"type": "object", "required": ["run_id", "version_key", "status"], "properties": {"run_id": {"type": "integer"}, "version_key": {"type": "string"}, "status": {"type": "string", "enum": ["queued", "planned"]}, "provenance": {"type": "object", "additionalProperties": true}}},
      "UncertaintyResponse": {"type": "object", "required": ["run_id", "valid_at", "method"], "properties": {"run_id": {"type": "integer"}, "valid_at": {"type": "string", "format": "date-time"}, "method": {"type": "string", "enum": ["quantiles", "ensemble"]}, "depth_mean_m": {"type": "number", "minimum": 0}, "depth_p05_m": {"type": "number", "minimum": 0}, "depth_p95_m": {"type": "number", "minimum": 0}, "ensemble_id": {"type": "string"}, "coverage": {"type": "object", "additionalProperties": true}}},
      "ImpactResponse": {"type": "object", "required": ["run_id", "valid_at", "exposure_people", "affected_facilities"], "properties": {"run_id": {"type": "integer"}, "valid_at": {"type": "string", "format": "date-time"}, "exposure_people": {"type": "number", "minimum": 0}, "affected_facilities": {"type": "integer", "minimum": 0}, "qc_flags": {"type": "array", "items": {"type": "string"}}, "provenance": {"type": "object", "additionalProperties": true}}},
      "RouteRequest": {"type": "object", "required": ["run_id", "departure_at", "origin", "destination"], "properties": {"run_id": {"type": "integer"}, "departure_at": {"type": "string", "format": "date-time"}, "origin": {"type": "string"}, "destination": {"type": "string"}, "mode": {"type": "string", "enum": ["vehicle", "walking"]}, "minimum_accessibility_probability": {"type": "number", "minimum": 0, "maximum": 1}}},
      "RouteResponse": {"type": "object", "required": ["reachable", "edge_ids", "provenance"], "properties": {"reachable": {"type": "boolean"}, "edge_ids": {"type": "array", "items": {"type": "integer"}}, "travel_time_minutes": {"type": "number", "minimum": 0}, "route_accessibility_probability": {"type": "number", "minimum": 0, "maximum": 1}, "provenance": {"type": "object", "additionalProperties": true}}},
      "ScenarioRequest": {"type": "object", "required": ["scenario_key", "base_run_id", "parameters"], "properties": {"scenario_key": {"type": "string"}, "base_run_id": {"type": "integer"}, "parameters": {"type": "object", "additionalProperties": true}}}
    }
  }
}
