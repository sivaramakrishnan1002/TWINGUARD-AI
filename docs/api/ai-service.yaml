{
  "openapi": "3.1.0",
  "info": {
    "title": "TwinGuard AI Service",
    "version": "0.3.0",
    "description": "C4 v0 remains the frozen G0 baseline; C4 v1 selectors follow CR-008. The AI service implements health, layers, B08 exact saved-artifact selectors, and B21 C9 metadata GETs in the local B11 package. The CR-010 C9 v1 raster-byte GET is verified in that same local package by B25 (commit 0aebc59); it serves only exact saved A20 research/simulation bytes. Forecast, uncertainty, route computation, and scenario computation remain HTTP 501. No live or deployment-wide operation is implied; C9 remains proposed and unfrozen. C4 v2 / CR-012 defines a test-scoped, read-only date-only replay projection; it is not mounted until B27 evidence passes."
  },
  "paths": {
    "/health": {
      "get": {
        "operationId": "health",
        "summary": "Report process health",
        "responses": {
          "200": {
            "description": "Service is available",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          }
        }
      }
    },
    "/layers": {
      "get": {
        "operationId": "listLayers",
        "summary": "List registered read-only spatial layers",
        "responses": {
          "200": {
            "description": "Layer metadata from the read-only catalogue",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Layer"
                  }
                }
              }
            }
          },
          "503": {
            "$ref": "#/components/responses/Unavailable"
          }
        }
      }
    },
    "/forecast": {
      "post": {
        "operationId": "createForecast",
        "summary": "Create a versioned forecast run",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ForecastRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Forecast accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RunAccepted"
                }
              }
            }
          },
          "422": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "501": {
            "description": "Forecast generation remains unavailable until its source/result selector semantics are implemented and verified."
          }
        },
        "x-current-runtime-status": 501,
        "description": "Design-only projection. Current runtime returns HTTP 501 Not Implemented; no live operation is enabled."
      }
    },
    "/uncertainty": {
      "post": {
        "operationId": "summarizeUncertainty",
        "summary": "Return uncertainty summaries for a run and time",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RunTimeRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Uncertainty summary",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UncertaintyResponse"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "501": {
            "description": "Uncertainty summaries remain unavailable until a compatible saved artifact operation is implemented and verified."
          }
        },
        "x-current-runtime-status": 501,
        "description": "Design-only projection. Current runtime returns HTTP 501 Not Implemented; no live operation is enabled."
      }
    },
    "/impact": {
      "post": {
        "operationId": "estimateImpact",
        "summary": "Read one saved A07 V4 impact result by its exact artifact key",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ImpactArtifactRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Unique saved A07 V4 result returned by the verified B08 read-only selector; response body follows frozen C7.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ImpactResult"
                }
              }
            }
          },
          "404": {
            "description": "No exact A07 artifact key exists; duplicate matches fail closed."
          },
          "503": {
            "description": "Registered artifact unavailable or duplicate selector match; the request fails closed."
          }
        },
        "description": "C4 v1 / CR-008. The B08 runtime performs an exact, read-only lookup in the registered A07 V4 artifact by (run_id, valid_at, scenario_key). A unique saved result returns the unchanged C7 body (source_mode SIMULATED); unknown keys return 404 and duplicate/corrupt artifact state fails closed with 503. No recomputation, live source, or database access is performed.",
        "x-current-runtime-status": 200,
        "x-contract-version": "C4-v1"
      }
    },
    "/route": {
      "post": {
        "operationId": "planRoute",
        "summary": "Project the A09 route result shape; the current operation remains an HTTP 501 stub.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RouteRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "DTO projection only; the current stub returns HTTP 501 and does not emit this result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RouteResponse"
                }
              }
            }
          },
          "422": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "501": {
            "description": "Route computation remains unavailable; no authoritative integer run mapping exists for the saved A09 records."
          }
        },
        "description": "The schema documents the DTO projection only. Current runtime behavior is HTTP 501 Not Implemented; no API or data integration is enabled.",
        "x-current-runtime-status": 501
      }
    },
    "/scenario": {
      "post": {
        "operationId": "createScenario",
        "summary": "Create a what-if scenario from a known state run",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ScenarioRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Scenario accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RunAccepted"
                }
              }
            }
          },
          "501": {
            "description": "Scenario creation remains unavailable until an evidence-backed scenario operation is implemented and verified."
          }
        },
        "x-current-runtime-status": 501,
        "description": "Design-only projection. Current runtime returns HTTP 501 Not Implemented; no live operation is enabled."
      }
    },
    "/scenario-visualization-assets": {
      "get": {
        "operationId": "listScenarioVisualizationAssets",
        "summary": "List manifest-backed scenario visualization assets",
        "description": "CR-009 authorizes this additive C9 read-only projection under approved change control. The operation reads only the validated A20 manifest and referenced saved research assets; it does not generate predictions or access live feeds or databases. B21 mounted and verified this operation in the local B11 app-tier package; no live, shared-database, or deployment-wide operation is implied.",
        "x-runtime-availability": "available_in_local_B11_package",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Manifest-backed catalog ; verified by B21 in the local B11 package.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ScenarioVisualizationCatalog"
                }
              }
            }
          },
          "409": {
            "description": "A duplicate or ambiguous scenario identity exists in the validated A20 manifest; no catalog result is returned."
          },
          "503": {
            "description": "The manifest or a referenced asset is missing, unreadable, changed, or unavailable. No partial result is returned."
          },
          "501": {
            "description": "Reserved; B21 mounted the approved operation in the local B11 package.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ScenarioVisualizationUnavailable"
                }
              }
            }
          }
        },
        "x-current-runtime-status": 200
      }
    },
    "/scenario-visualization-assets/{event_id}/{scenario_id}": {
      "get": {
        "operationId": "getScenarioVisualizationAsset",
        "summary": "Get one saved scenario visualization asset",
        "description": "CR-009 authorizes this additive C9 read-only projection under approved change control. The operation reads only the validated A20 manifest and referenced saved research assets; it does not generate predictions or access live feeds or databases. B21 mounted and verified this operation in the local B11 app-tier package; no live, shared-database, or deployment-wide operation is implied.",
        "x-runtime-availability": "available_in_local_B11_package",
        "parameters": [
          {
            "name": "event_id",
            "in": "path",
            "required": true,
            "description": "Source event date used as part of the stable manifest identity.",
            "schema": {
              "type": "string",
              "format": "date",
              "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
            }
          },
          {
            "name": "scenario_id",
            "in": "path",
            "required": true,
            "description": "Scenario ID from the A20 manifest.",
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Exact manifest-backed scenario detail ; verified by B21 in the local B11 package.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ScenarioVisualizationAsset"
                }
              }
            }
          },
          "400": {
            "description": "Invalid event_id or scenario_id selector; no saved result is returned."
          },
          "404": {
            "description": "No exact event_id/scenario_id match exists in the validated A20 manifest."
          },
          "409": {
            "description": "A duplicate or ambiguous scenario identity exists; no result is returned."
          },
          "503": {
            "description": "The manifest or a referenced asset is missing, unreadable, changed, or unavailable. No partial result is returned."
          },
          "501": {
            "description": "Reserved; B21 mounted the approved operation in the local B11 package.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ScenarioVisualizationUnavailable"
                }
              }
            }
          }
        },
        "x-current-runtime-status": 200
      }
    },
    "/route-results/{result_id}": {
      "get": {
        "operationId": "getSavedRouteResult",
        "summary": "Read one saved A09 revision-3 route result",
        "description": "C4 v1 / CR-008. The B08 runtime performs exact read-only retrieval from the registered A09 revision-3 artifact. result_id is unique only within that immutable artifact revision and is not global. A unique saved result returns the unchanged C8 body; unknown IDs return 404 and duplicate/corrupt artifact state fails closed with 503. This retrieves a simulated result and does not compute a route or access a database/live source.",
        "x-contract-version": "C4-v1",
        "x-current-runtime-status": 200,
        "parameters": [
          {
            "name": "result_id",
            "in": "path",
            "required": true,
            "description": "A09 revision-3-scoped saved result identifier; not globally unique.",
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Unique saved simulated A09 revision-3 result returned by the verified B08 lookup; response body follows frozen C8.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RouteResponse"
                }
              }
            }
          },
          "404": {
            "description": "No exact result_id exists in the registered A09 revision-3 artifact; duplicate matches fail closed."
          },
          "503": {
            "description": "Registered artifact unavailable or duplicate result_id; the request fails closed."
          }
        }
      }
    },
    "/scenario-visualization-assets/{event_id}/{scenario_id}/raster": {
      "get": {
        "operationId": "getScenarioVisualizationRaster",
        "summary": "Read exact saved A20 GeoTIFF bytes",
        "description": "CR-010 authorizes this additive proposed C9 v1 AI-service read. B25 commit 0aebc59 verifies the rebuilt local B11 package returns exact original manifest-selected single-band Float32 GeoTIFF bytes after selector, size, hash, and TIFF metadata checks. The response preserves saved values, mask, CRS, metadata, and bytes; its quoted ETag is the manifest SHA-256. Invalid selectors return 400, exact misses 404, duplicate identity 409, and unavailable or invalid assets 503 without partial bytes. It creates no tiles or scientific outputs and does not enable live feeds, databases, predictions, warnings, or routing. Availability is evidenced only for the local B11 package; C9 remains proposed and unfrozen.",
        "x-contract-version": "C9-v1",
        "x-runtime-availability": "available_in_local_B11_package",
        "x-current-runtime-status": 200,
        "parameters": [
          {
            "name": "event_id",
            "in": "path",
            "required": true,
            "description": "Exact manifest event date.",
            "schema": {
              "type": "string",
              "format": "date",
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            }
          },
          {
            "name": "scenario_id",
            "in": "path",
            "required": true,
            "description": "Exact manifest scenario identity.",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
            }
          },
          {
            "name": "valid_time_utc",
            "in": "query",
            "required": true,
            "description": "Exact saved UTC slice from C9 detail; no rounding or interpolation.",
            "schema": {
              "type": "string",
              "format": "date-time",
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
            },
            "example": "2015-11-30T06:00:00Z"
          },
          {
            "name": "band",
            "in": "query",
            "required": true,
            "description": "Saved parameter-member spread band.",
            "schema": {
              "type": "string",
              "enum": [
                "p05",
                "p50",
                "p95"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Exact original image/tiff bytes from the manifest-selected GeoTIFF, unchanged; the body SHA-256 equals the C9 detail reference and the quoted ETag.",
            "content": {
              "image/tiff": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            },
            "headers": {
              "ETag": {
                "description": "Quoted lowercase SHA-256 hex digest of the exact original response bytes, equal to the selected C9 detail reference.",
                "schema": {
                  "type": "string",
                  "pattern": "^\"[0-9a-f]{64}\"$"
                }
              }
            }
          },
          "400": {
            "description": "Invalid event/scenario selector, noncanonical or absent saved UTC time, unsupported band, unexpected query selector, duplicate query selector, or request body. No raster bytes are returned.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "detail"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "404": {
            "description": "No exact saved event/scenario/time/band identity exists. No raster bytes are returned.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "detail"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "409": {
            "description": "The manifest contains duplicate or ambiguous scenario or saved-time identity. No raster bytes are returned.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "detail"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "503": {
            "description": "Manifest or asset is missing, unreadable, changed, oversized, outside the allowed reference set, or fails size, SHA-256, TIFF metadata, grid, CRS, NoData, or mask validation. No partial raster body is returned.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "detail"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "501": {
            "description": "Reserved fallback declared by the route projection; it was not observed in the verified local B11 runtime, where the raster operation returned 200 for an exact saved selector.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "detail"
                  ],
                  "additionalProperties": false
                }
              }
            }
          }
        }
      }
    },
    "/replay-alerts/{event_id}": {
      "get": {
        "operationId": "getB13ReplayObservation",
        "summary": "Read the uniquely selected date-only POONDI replay observation and separate derived-output status",
        "description": "C4 v2 / CR-012, conditional CR-011 route approval. This is a read-only, test-scoped exact lookup of the B28-identified source observation and the result of the approved B19 replay processing. It returns the source observation separately from an optional derived alert; a derived alert is replay-derived and not historically observed. Only the exact approved POONDI source selector is eligible. Historical measurement-time meaning and timezone remain unknown. No flood-depth result is produced by this Track B rule path. The route is not mounted by this projection review; current runtime status is unexposed until B27 passes.",
        "x-contract-version": "C4-v2",
        "x-change-request": "CR-012",
        "x-current-runtime-status": "unexposed",
        "x-source-mode": "REPLAY",
        "parameters": [
          {
            "name": "event_id",
            "in": "path",
            "required": true,
            "description": "Exact date-only event selector. The sole approved fixture is replay:POONDI:date:2015-12-01; a well-formed but absent selector returns 404.",
            "schema": {
              "type": "string",
              "pattern": "^replay:[A-Z]+:date:[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Exact source observation with C3 date-only semantics, deterministic replay identity, and an explicit produced/not_produced derived-output state.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayObservationResult"
                }
              }
            }
          },
          "400": {
            "description": "Malformed or invalid selector/input.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayLookupError"
                }
              }
            }
          },
          "404": {
            "description": "No exact matching source observation/replay identity exists.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayLookupError"
                }
              }
            }
          },
          "409": {
            "description": "More than one record matches the exact identity; no result is returned.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayLookupError"
                }
              }
            }
          },
          "503": {
            "description": "Source, context, configuration, or derived asset is missing, unreadable, unavailable, or fails SHA-256 verification; no partial result is returned.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayLookupError"
                }
              }
            }
          }
        }
      }
    },
    "/reservoirs/history": {
      "get": {
        "operationId": "getCfmReservoirHistory",
        "summary": "Fetch an on-demand public CFM-DSS reservoir snapshot",
        "description": "Low-volume educational prototype read. Returns latest-published dashboard history, not sub-hourly telemetry. Does not trigger flood-model recomputation or operational decisions.",
        "parameters": [
          {
            "name": "period",
            "in": "query",
            "required": false,
            "description": "History aggregation; daily returns at most 75 rows and monthly at most 65 rows.",
            "schema": {
              "type": "string",
              "enum": [
                "daily",
                "monthly"
              ],
              "default": "daily"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Validated latest-published history; source freshness and observation time remain unknown.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CfmReservoirHistory"
                }
              }
            }
          },
          "422": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "503": {
            "description": "Source unavailable or payload invalid; details, tokens and upstream bodies are not exposed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CfmReservoirUnavailable"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "responses": {
      "Unavailable": {
        "description": "Required read-only data service unavailable"
      },
      "NotFound": {
        "description": "Run or requested time not found"
      },
      "InvalidRequest": {
        "description": "Request validation failed"
      }
    },
    "schemas": {
      "Health": {
        "type": "object",
        "required": [
          "status",
          "service"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok"
            ]
          },
          "service": {
            "type": "string"
          },
          "database": {
            "type": "string",
            "enum": [
              "ok",
              "unavailable",
              "not_checked"
            ]
          }
        }
      },
      "Layer": {
        "properties": {
          "layer_key": {
            "title": "Layer Key",
            "type": "string"
          },
          "source_layer": {
            "title": "Source Layer",
            "type": "string"
          },
          "source_crs": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Source Crs"
          },
          "target_srid": {
            "title": "Target Srid",
            "type": "integer"
          },
          "loaded_row_count": {
            "minimum": 0,
            "title": "Loaded Row Count",
            "type": "integer"
          },
          "units": {
            "additionalProperties": {
              "type": "string"
            },
            "title": "Units",
            "type": "object"
          },
          "zoom": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/LayerZoomRange"
              },
              {
                "type": "null"
              }
            ]
          },
          "attribution": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Attribution"
          },
          "vintage": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Vintage"
          },
          "provenance": {
            "$ref": "#/components/schemas/LayerLayerProvenance"
          },
          "nodata": {
            "title": "Nodata",
            "type": "string"
          },
          "tile_endpoint_available": {
            "const": false,
            "title": "Tile Endpoint Available",
            "type": "boolean"
          }
        },
        "required": [
          "layer_key",
          "source_layer",
          "source_crs",
          "target_srid",
          "loaded_row_count",
          "units",
          "zoom",
          "attribution",
          "vintage",
          "provenance",
          "nodata",
          "tile_endpoint_available"
        ],
        "title": "Layer",
        "type": "object",
        "description": "Read-only catalogue metadata. Database MVT functions do not expose HTTP tiles; current tile_endpoint_available is always false."
      },
      "ForecastRequest": {
        "type": "object",
