{
  "openapi": "3.1.0",
  "info": {
    "title": "TwinGuard AI Service",
    "version": "0.6.0",
    "description": "C4 v0 remains the frozen G0 baseline; C4 v1 selectors follow CR-008. The AI service implements health, layers, B08 exact saved-artifact selectors, and B21 C9 metadata GETs in the local B11 package. The CR-010 C9 v1 raster-byte GET is verified in that same local package by B25 (commit 0aebc59); it serves only exact saved A20 research/simulation bytes. Forecast, uncertainty, route computation, and scenario computation remain HTTP 501. No live or deployment-wide operation is implied; C9 remains proposed and unfrozen. C4 v2 / CR-012 defines a test-scoped, read-only date-only replay projection; it is not mounted until B27 evidence passes. C4 v3 (OD-2026-11-07 / CR-019) is a proposed, unmounted product-API section under `x-c4-v3-product-api`; operations move into `paths` only when mounted and tested."
  },
