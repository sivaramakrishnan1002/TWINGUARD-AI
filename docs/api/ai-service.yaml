    "components": {
      "schemas": {
        "SourceMode": {
          "type": "string",
          "enum": [
            "SIMULATED",
            "MODEL_FORECAST",
            "PUBLISHED_SNAPSHOT",
            "SCENARIO_INPUT",
            "REPLAY",
            "STATIC_REFERENCE"
          ],
          "description": "SIMULATED = flood-engine output; MODEL_FORECAST = Open-Meteo numerical weather model; PUBLISHED_SNAPSHOT = CFM-DSS public dashboard read; SCENARIO_INPUT = owner-set value; REPLAY = archived historical record; STATIC_REFERENCE = OSM/ward/boundary data. No value with a non-observed mode may be shown as observed."
        },
        "LonLat": {
          "type": "object",
          "required": [
            "lon",
            "lat"
          ],
          "additionalProperties": false,
          "properties": {
            "lon": {
              "type": "number",
              "minimum": 79.9,
              "maximum": 80.5
            },
            "lat": {
              "type": "number",
              "minimum": 12.7,
              "maximum": 13.4
            }
          },
          "example": {
            "lon": 80.2209,
            "lat": 12.9815
          }
        },
        "ApiError": {
          "type": "object",
          "required": [
            "detail",
            "code"
          ],
          "properties": {
            "detail": {
              "type": "string"
            },
            "code": {
              "type": "string",
              "enum": [
                "bad_request",
                "not_found",
                "conflict",
                "invalid",
                "rate_limited",
                "unavailable"
              ]
            },
            "retry_after_s": {
              "type": [
                "integer",
                "null"
              ],
              "minimum": 0
            }
          },
          "example": {
            "detail": "Weather cache is fresh; next fetch allowed in 412 s.",
            "code": "rate_limited",
            "retry_after_s": 412
          }
        },
        "Provenance": {
          "type": "object",
          "required": [
            "engine_version",
            "run_id",
            "inputs"
          ],
          "properties": {
            "engine_version": {
              "type": "string"
            },
            "run_id": {
              "type": "string"
            },
            "forcing_sha256": {
              "type": [
                "string",
                "null"
              ]
            },
            "static_assets_version": {
              "type": [
                "string",
                "null"
              ]
            },
            "inputs": {
              "type": "array",
              "items": {
                "type": "object",
                "required": [
                  "name",
                  "source",
                  "source_mode"
                ],
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "source": {
                    "type": "string"
                  },
                  "source_mode": {
                    "$ref": "#/x-c4-v3-product-api/components/schemas/SourceMode"
                  },
                  "fetched_at": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "format": "date-time"
                  },
                  "sha256": {
                    "type": [
                      "string",
                      "null"
                    ]
                  }
                }
              }
            },
            "device": {
              "type": "object",
              "description": "Device the run actually used (OD-2026-11-08). Optional, additive.",
              "required": [
                "used"
              ],
              "properties": {
                "used": {
                  "type": "string",
                  "enum": [
                    "cuda",
                    "cpu"
                  ]
                },
                "name": {
                  "type": [
                    "string",
                    "null"
                  ]
                },
                "fallback_reason": {
                  "type": [
                    "string",
                    "null"
                  ],
                  "description": "Set when a CUDA attempt failed and the run was recomputed on CPU."
                }
              },
              "example": {
                "used": "cpu",
                "name": null,
                "fallback_reason": "CUDA out of memory (4 GB); rerun on cpu"
              }
            }
          },
          "example": {
            "engine_version": "twinguard-flood-engine/2.0.0",
            "run_id": "sim-20261107T063000Z-3fa9c2d1",
            "forcing_sha256": "9f2c...e1",
            "static_assets_version": "a25_static_v1",
            "inputs": [
              {
                "name": "rainfall",
                "source": "open-meteo:ecmwf_ifs025",
                "source_mode": "MODEL_FORECAST",
                "fetched_at": "2026-11-07T06:29:41Z",
                "sha256": "41aa...07"
              }
            ]
          }
        },
        "GridSpec": {
          "type": "object",
          "required": [
            "crs",
            "origin_x_m",
            "origin_y_m",
            "cell_size_m",
            "rows",
            "cols",
            "bbox_wgs84"
          ],
          "description": "Raster origin is the upper-left corner; row 0 is north. Projected CRS EPSG:32644 (metres).",
          "properties": {
            "crs": {
              "const": "EPSG:32644"
            },
            "origin_x_m": {
              "type": "number"
            },
            "origin_y_m": {
              "type": "number"
            },
            "cell_size_m": {
              "type": "number",
              "minimum": 1,
              "description": "Cell size in metres. Engine grids are 30 (A25 focus), 90 or 120 (A25 citywide), 100, or 600 (interim A06/A23). Strided responses (e.g. FlowFrame with stride n) report cell_size_m * n, e.g. 240 or 480. Relaxed from an enum on 2026-11-08 (additive)."
            },
            "rows": {
              "type": "integer"
            },
            "cols": {
              "type": "integer"
            },
            "bbox_wgs84": {
              "type": "array",
              "items": {
                "type": "number"
              },
              "minItems": 4,
              "maxItems": 4
            }
          },
          "example": {
            "crs": "EPSG:32644",
            "origin_x_m": 395000.0,
            "origin_y_m": 1468000.0,
            "cell_size_m": 100,
            "rows": 520,
            "cols": 410,
            "bbox_wgs84": [
              80.005,
              12.852,
              80.342,
              13.292
            ]
          }
        },
        "Frame": {
          "type": "object",
          "required": [
            "index",
            "valid_time_utc"
          ],
          "properties": {
            "index": {
              "type": "integer",
              "minimum": 0
            },
            "valid_time_utc": {
              "type": "string",
              "format": "date-time"
            },
            "elapsed_minutes": {
              "type": "integer",
              "minimum": 0
            }
          }
        },
        "CustomRainfall": {
          "type": "object",
          "required": [
            "start_time_utc",
            "interval_minutes",
            "values_mm"
          ],
          "description": "Uniform areal rainfall depth per interval (mm per interval, not mm/h).",
          "properties": {
            "start_time_utc": {
              "type": "string",
              "format": "date-time"
            },
            "interval_minutes": {
              "type": "integer",
              "enum": [
                15,
                30,
                60
              ]
            },
            "values_mm": {
              "type": "array",
              "minItems": 1,
              "maxItems": 288,
              "items": {
                "type": "number",
                "minimum": 0,
                "maximum": 200
              }
            }
          },
          "example": {
            "start_time_utc": "2026-11-07T00:00:00Z",
            "interval_minutes": 60,
            "values_mm": [
              5,
              12,
              30,
              45,
              22,
              8,
              2,
              0
            ]
          }
        },
        "WhatIfModifiers": {
          "type": "object",
          "required": [
            "base_run_id"
          ],
          "properties": {
            "base_run_id": {
              "type": "string"
            },
            "rainfall_scale_pct": {
              "type": "number",
              "minimum": 0,
              "maximum": 300,
              "default": 100,
              "description": "Percentage of the base rainfall (100 = unchanged)."
            },
            "reservoir_release_m3s": {
              "type": "object",
              "description": "Scenario outflow per reservoir in cubic metres per second (1 m3/s = 35.3147 cusecs).",
              "propertyNames": {
                "enum": [
                  "CHEMBARAMBAKKAM",
                  "POONDI",
                  "PUZHAL",
                  "CHOLAVARAM"
                ]
              },
              "additionalProperties": {
                "type": "number",
                "minimum": 0,
                "maximum": 3000
              }
            },
            "tide_offset_m": {
              "type": "number",
              "minimum": -1.0,
              "maximum": 2.0,
              "default": 0.0,
              "description": "Sea-level boundary offset in metres relative to the base run."
            }
          },
          "example": {
            "base_run_id": "evt-20261107T050000Z-0b11aa20",
            "rainfall_scale_pct": 130,
            "reservoir_release_m3s": {
              "CHEMBARAMBAKKAM": 850
            },
            "tide_offset_m": 0.5
          }
        },
        "SimulationRequest": {
          "type": "object",
          "required": [
            "mode"
          ],
          "additionalProperties": false,
          "properties": {
            "mode": {
              "type": "string",
              "enum": [
                "event",
                "custom",
                "forecast",
                "what_if"
              ],
              "description": "event = saved historical event forcing; custom = user rainfall; forecast = on-demand Open-Meteo fetch (cached, minimum interval); what_if = modifiers on a base run."
            },
            "event_key": {
              "type": "string",
              "description": "Required when mode=event; see GET /v3/events."
