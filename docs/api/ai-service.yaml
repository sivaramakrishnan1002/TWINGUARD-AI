          },
          "503": {
            "description": "Registered artifact unavailable or duplicate result_id; the request fails closed."
          }
        }
      }
    },
    "/scenario-visualization-assets/{event_id}/{scenario_id}/raster": {
      "get": {
        "operationId": "getScenarioVisualizationRaster",
        "summary": "Read exact saved A20 GeoTIFF bytes",
        "description": "CR-010 authorizes this additive proposed C9 v1 AI-service read. B25 commit 0aebc59 verifies the rebuilt local B11 package returns exact original manifest-selected single-band Float32 GeoTIFF bytes after selector, size, hash, and TIFF metadata checks. The response preserves saved values, mask, CRS, metadata, and bytes; its quoted ETag is the manifest SHA-256. Invalid selectors return 400, exact misses 404, duplicate identity 409, and unavailable or invalid assets 503 without partial bytes. It creates no tiles or scientific outputs and does not enable live feeds, databases, predictions, warnings, or routing. Availability is evidenced only for the local B11 package; C9 remains proposed and unfrozen.",
        "x-contract-version": "C9-v1",
        "x-runtime-availability": "available_in_local_B11_package",
        "x-current-runtime-status": 200,
        "parameters": [
          {
            "name": "event_id",
            "in": "path",
            "required": true,
            "description": "Exact manifest event date.",
            "schema": {
              "type": "string",
              "format": "date",
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            }
          },
          {
            "name": "scenario_id",
            "in": "path",
            "required": true,
            "description": "Exact manifest scenario identity.",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
            }
          },
          {
            "name": "valid_time_utc",
            "in": "query",
            "required": true,
            "description": "Exact saved UTC slice from C9 detail; no rounding or interpolation.",
            "schema": {
              "type": "string",
              "format": "date-time",
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
            },
            "example": "2015-11-30T06:00:00Z"
          },
          {
            "name": "band",
            "in": "query",
            "required": true,
            "description": "Saved parameter-member spread band.",
            "schema": {
              "type": "string",
              "enum": [
                "p05",
                "p50",
                "p95"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Exact original image/tiff bytes from the manifest-selected GeoTIFF, unchanged; the body SHA-256 equals the C9 detail reference and the quoted ETag.",
            "content": {
              "image/tiff": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            },
            "headers": {
              "ETag": {
                "description": "Quoted lowercase SHA-256 hex digest of the exact original response bytes, equal to the selected C9 detail reference.",
                "schema": {
                  "type": "string",
                  "pattern": "^\"[0-9a-f]{64}\"$"
                }
              }
            }
          },
          "400": {
            "description": "Invalid event/scenario selector, noncanonical or absent saved UTC time, unsupported band, unexpected query selector, duplicate query selector, or request body. No raster bytes are returned.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "detail"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "404": {
            "description": "No exact saved event/scenario/time/band identity exists. No raster bytes are returned.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "detail"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "409": {
            "description": "The manifest contains duplicate or ambiguous scenario or saved-time identity. No raster bytes are returned.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "detail"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "503": {
            "description": "Manifest or asset is missing, unreadable, changed, oversized, outside the allowed reference set, or fails size, SHA-256, TIFF metadata, grid, CRS, NoData, or mask validation. No partial raster body is returned.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "detail"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "501": {
            "description": "Reserved fallback declared by the route projection; it was not observed in the verified local B11 runtime, where the raster operation returned 200 for an exact saved selector.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "code",
                    "detail"
                  ],
                  "additionalProperties": false
                }
              }
            }
          }
        }
      }
    },
    "/replay-alerts/{event_id}": {
      "get": {
        "operationId": "getB13ReplayObservation",
        "summary": "Read the uniquely selected date-only POONDI replay observation and separate derived-output status",
        "description": "C4 v2 / CR-012, conditional CR-011 route approval. This is a read-only, test-scoped exact lookup of the B28-identified source observation and the result of the approved B19 replay processing. It returns the source observation separately from an optional derived alert; a derived alert is replay-derived and not historically observed. Only the exact approved POONDI source selector is eligible. Historical measurement-time meaning and timezone remain unknown. No flood-depth result is produced by this Track B rule path. The route is not mounted by this projection review; current runtime status is unexposed until B27 passes.",
        "x-contract-version": "C4-v2",
        "x-change-request": "CR-012",
        "x-current-runtime-status": "unexposed",
        "x-source-mode": "REPLAY",
        "parameters": [
          {
            "name": "event_id",
            "in": "path",
            "required": true,
            "description": "Exact date-only event selector. The sole approved fixture is replay:POONDI:date:2015-12-01; a well-formed but absent selector returns 404.",
            "schema": {
              "type": "string",
              "pattern": "^replay:[A-Z]+:date:[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Exact source observation with C3 date-only semantics, deterministic replay identity, and an explicit produced/not_produced derived-output state.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayObservationResult"
                }
              }
            }
          },
          "400": {
            "description": "Malformed or invalid selector/input.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayLookupError"
                }
              }
            }
          },
          "404": {
            "description": "No exact matching source observation/replay identity exists.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayLookupError"
                }
              }
            }
          },
          "409": {
            "description": "More than one record matches the exact identity; no result is returned.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayLookupError"
                }
              }
            }
          },
          "503": {
            "description": "Source, context, configuration, or derived asset is missing, unreadable, unavailable, or fails SHA-256 verification; no partial result is returned.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayLookupError"
                }
              }
            }
          }
        }
      }
    },
