        "description": "A missing alert is explicitly represented as not_produced; never fabricate one to fill the UI. Current approved B19 path produces a storage-rule alert only, not a flood-depth result."
      },
      "ReplayObservationResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "contract_version",
          "source_observation",
          "replay",
          "derived_output",
          "limitations"
        ],
        "properties": {
          "contract_version": {
            "const": "C4-v2",
            "type": "string"
          },
          "source_observation": {
            "$ref": "#/components/schemas/ReplaySourceObservation"
          },
          "replay": {
            "$ref": "#/components/schemas/ReplayRunIdentity"
          },
          "derived_output": {
            "$ref": "#/components/schemas/ReplayDerivedOutput"
          },
          "limitations": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "minItems": 1,
            "description": "Must state historical time/timezone unknown; derived-only output; storage-rule scope; rainfall-unit limitation; not flood science, live warning, validated forecast, or safety guidance."
          }
        }
      },
      "ReplayLookupError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "code",
          "detail"
        ],
        "properties": {
          "status": {
            "type": "integer",
            "enum": [
              400,
              404,
              409,
              503
            ]
          },
          "code": {
            "type": "string",
            "enum": [
              "invalid_selector",
              "not_found",
              "ambiguous_identity",
              "asset_unavailable"
            ]
          },
          "detail": {
            "type": "string",
            "minLength": 1
          }
        },
        "oneOf": [
          {
            "properties": {
              "status": {
                "const": 400
              },
              "code": {
                "const": "invalid_selector"
              }
            }
          },
          {
            "properties": {
              "status": {
                "const": 404
              },
              "code": {
                "const": "not_found"
              }
            }
          },
          {
            "properties": {
              "status": {
                "const": 409
              },
              "code": {
                "const": "ambiguous_identity"
              }
            }
          },
          {
            "properties": {
              "status": {
                "const": 503
              },
              "code": {
                "const": "asset_unavailable"
              }
            }
          }
        ]
      },
      "CfmReservoirHistory": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "history_kind",
          "source_id",
          "source_mode",
          "received_at",
          "availability",
          "freshness",
          "records",
          "limitations"
        ],
        "properties": {
          "history_kind": {
            "type": "string",
            "enum": [
              "daily",
              "monthly"
            ]
          },
          "source_id": {
            "type": "string",
            "const": "tn_cfm_dss_public_lakes_dashboard"
          },
          "source_mode": {
            "type": "string",
            "const": "LIVE"
          },
          "received_at": {
            "type": "string",
            "format": "date-time",
            "description": "Time this service fetched the response; not the source observation time."
          },
          "availability": {
            "type": "string",
            "const": "available"
          },
          "freshness": {
            "type": "string",
            "const": "unknown"
          },
          "records": {
            "type": "array",
            "minItems": 1,
            "maxItems": 75,
            "items": {
              "$ref": "#/components/schemas/CfmReservoirRecord"
            }
          },
          "limitations": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "string"
            }
          }
        }
      },
      "CfmReservoirRecord": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reservoir_id",
          "reservoir_name",
          "source_date",
          "time_precision",
          "observed_at",
          "observation_timezone",
          "water_level_m",
          "average_storage_mcm",
          "received_at",
          "source_mode",
          "availability",
          "freshness",
          "freshness_note",
          "provenance"
        ],
        "properties": {
          "reservoir_id": {
            "type": "string"
          },
          "reservoir_name": {
            "type": "string"
          },
          "source_date": {
            "type": "string",
            "format": "date",
            "description": "Source calendar bucket. For monthly history this is the first day of the month label, not an exact observation date."
          },
          "time_precision": {
            "type": "string",
            "const": "date"
          },
          "observed_at": {
            "type": "null",
            "description": "Unknown; the dashboard date label does not specify an observation instant."
          },
          "observation_timezone": {
            "type": "string",
            "const": "unknown"
          },
          "water_level_m": {
            "type": "number",
            "minimum": 0
          },
          "average_storage_mcm": {
            "type": "number",
            "minimum": 0
          },
          "received_at": {
            "type": "string",
            "format": "date-time"
          },
          "source_mode": {
            "type": "string",
            "const": "LIVE"
          },
          "availability": {
            "type": "string",
            "const": "available"
          },
          "freshness": {
            "type": "string",
            "const": "unknown"
          },
          "freshness_note": {
            "type": "string"
          },
          "provenance": {
            "$ref": "#/components/schemas/CfmReservoirProvenance"
          }
        }
      },
      "CfmReservoirProvenance": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "source_id",
          "endpoint",
          "response_sha256"
        ],
        "properties": {
          "source_id": {
            "type": "string",
            "const": "tn_cfm_dss_public_lakes_dashboard"
          },
          "endpoint": {
            "type": "string",
            "enum": [
              "/Master/GetLast15daysWaterLevel",
              "/Master/GetMonthlyWaterLevelOfReservoir"
            ]
          },
          "response_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        }
      },
      "CfmReservoirUnavailable": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "detail"
        ],
        "properties": {
          "detail": {
            "type": "string",
            "const": "Reservoir source is unavailable or returned invalid data."
          }
        }
      }
    }
  }
}
