{
  "openapi": "3.1.0",
  "info": {
    "title": "TwinGuard Backend API",
    "version": "0.3.0",
    "description": "C4 v0 remains the frozen G0 baseline; approved C4 v1 saved selectors are documented under CR-008. Health and the CR-009 C9 metadata catalog and detail GETs are mounted and verified only in the local B11 package. CR-010 raster delivery is AI-service-only and verified in the local B11 package; no backend raster operation is exposed. Other backend business routes remain unexposed. C9 remains proposed and unfrozen; schemas do not imply live integration. C4 v2 / CR-012 replay projection is documented but unexposed until B27 evidence passes."
  },
  "paths": {
    "/twin/state": {
      "get": {
        "operationId": "getTwinState",
        "summary": "Read the latest or requested twin state",
        "parameters": [
          {
            "name": "at",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "run_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Twin state reference and metadata",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TwinState"
                }
              }
            }
          },
          "404": {
            "description": "State unavailable"
          }
        },
        "x-current-runtime-status": "unexposed"
      }
    },
    "/scenarios": {
      "get": {
        "operationId": "listScenarios",
        "summary": "List saved scenarios",
        "responses": {
          "200": {
            "description": "Scenario list",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Scenario"
                  }
                }
              }
            }
          }
        },
        "x-current-runtime-status": "unexposed"
      },
      "post": {
        "operationId": "createScenario",
        "summary": "Create a scenario",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ScenarioCreate"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Scenario created",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Scenario"
                }
              }
            }
          },
          "422": {
            "description": "Invalid scenario"
          }
        },
        "x-current-runtime-status": "unexposed"
      }
    },
    "/scenarios/{scenario_key}": {
      "get": {
        "operationId": "getScenario",
        "summary": "Read a saved scenario",
        "parameters": [
          {
            "name": "scenario_key",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Scenario",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Scenario"
                }
              }
            }
          },
          "404": {
            "description": "Scenario not found"
          }
        },
        "x-current-runtime-status": "unexposed"
      }
    },
    "/routes": {
      "post": {
        "operationId": "requestRoute",
        "summary": "Request a route for a twin run",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RouteRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "DTO projection only; this route is not currently exposed by the backend runtime.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RouteResult"
                }
              }
            }
          },
          "422": {
            "description": "Invalid route request"
          },
          "404": {
            "description": "Current backend runtime does not expose this path."
          }
        },
        "description": "DTO projection only. The backend route path is not currently exposed; the application has no mounted route controller. Configured internal gateway adapters remain unavailable until service setup.",
        "x-current-runtime-status": "unexposed"
      }
    },
    "/alerts": {
      "get": {
        "operationId": "listAlerts",
        "summary": "List alerts in a requested time range",
        "parameters": [
          {
            "name": "from",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Alert list",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Alert"
                  }
                }
              }
            }
          }
        },
        "x-current-runtime-status": "unexposed"
      }
    },
    "/shelters": {
      "get": {
        "operationId": "listShelters",
        "summary": "List shelter and candidate-shelter states",
        "parameters": [
          {
            "name": "at",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "run_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Shelters and candidate status",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Shelter"
                  }
                }
              }
            }
          }
        },
        "x-current-runtime-status": "unexposed"
      }
    },
    "/scenario-visualization-assets": {
      "get": {
        "operationId": "listScenarioVisualizationAssets",
        "summary": "List manifest-backed scenario visualization assets",
        "description": "CR-009 authorizes this additive C9 read-only projection under approved change control. The operation reads only the validated A20 manifest and referenced saved research assets; it does not generate predictions or access live feeds or databases. B21 mounted and verified this operation in the local B11 app-tier package; no live, shared-database, or deployment-wide operation is implied.",
        "x-runtime-availability": "available_in_local_B11_package",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Manifest-backed catalog ; verified by B21 in the local B11 package.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ScenarioVisualizationCatalog"
                }
              }
            }
          },
          "409": {
            "description": "A duplicate or ambiguous scenario identity exists in the validated A20 manifest; no catalog result is returned."
          },
          "503": {
            "description": "The manifest or a referenced asset is missing, unreadable, changed, or unavailable. No partial result is returned."
          },
          "501": {
            "description": "Reserved; B21 mounted the approved operation in the local B11 package.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ScenarioVisualizationUnavailable"
                }
              }
            }
          }
        },
        "x-current-runtime-status": 200
      }
    },
    "/scenario-visualization-assets/{event_id}/{scenario_id}": {
      "get": {
        "operationId": "getScenarioVisualizationAsset",
        "summary": "Get one saved scenario visualization asset",
        "description": "CR-009 authorizes this additive C9 read-only projection under approved change control. The operation reads only the validated A20 manifest and referenced saved research assets; it does not generate predictions or access live feeds or databases. B21 mounted and verified this operation in the local B11 app-tier package; no live, shared-database, or deployment-wide operation is implied.",
        "x-runtime-availability": "available_in_local_B11_package",
        "parameters": [
          {
            "name": "event_id",
            "in": "path",
            "required": true,
            "description": "Source event date used as part of the stable manifest identity.",
            "schema": {
              "type": "string",
              "format": "date",
              "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
            }
          },
          {
            "name": "scenario_id",
            "in": "path",
            "required": true,
            "description": "Scenario ID from the A20 manifest.",
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Exact manifest-backed scenario detail ; verified by B21 in the local B11 package.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ScenarioVisualizationAsset"
                }
              }
            }
          },
          "400": {
            "description": "Invalid event_id or scenario_id selector; no saved result is returned."
          },
          "404": {
            "description": "No exact event_id/scenario_id match exists in the validated A20 manifest."
          },
          "409": {
            "description": "A duplicate or ambiguous scenario identity exists; no result is returned."
          },
          "503": {
            "description": "The manifest or a referenced asset is missing, unreadable, changed, or unavailable. No partial result is returned."
          },
          "501": {
            "description": "Reserved; B21 mounted the approved operation in the local B11 package.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ScenarioVisualizationUnavailable"
                }
              }
            }
          }
        },
        "x-current-runtime-status": 200
      }
    },
    "/impact": {
      "post": {
        "operationId": "getSavedImpactResult",
        "summary": "Read one saved A07 V4 impact result by its exact artifact key",
        "description": "C4 v1 / CR-008. Exact read-only lookup by (run_id, valid_at, scenario_key); no default scenario, recomputation, live source, or database access. The response follows frozen C7. This backend operation is not exposed by the current runtime.",
        "x-contract-version": "C4-v1",
        "x-current-runtime-status": "unexposed",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ImpactArtifactRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Saved A07 result; response follows frozen C7.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ImpactResult"
                }
              }
            }
          },
          "404": {
            "description": "No exact A07 artifact key exists; duplicate matches fail closed."
          },
          "422": {
            "description": "Invalid selector."
          }
        }
      }
    },
    "/route-results/{result_id}": {
      "get": {
        "operationId": "getSavedRouteResult",
        "summary": "Read one saved A09 revision-3 route result",
        "description": "C4 v1 / CR-008. Read-only retrieval from the registered A09 revision-3 artifact. result_id is unique only within that immutable artifact revision and is not a global identifier. This does not compute a route. The path is not exposed by the current backend runtime.",
        "x-contract-version": "C4-v1",
        "x-current-runtime-status": "unexposed",
        "parameters": [
          {
            "name": "result_id",
            "in": "path",
            "required": true,
            "description": "A09 revision-3-scoped saved result identifier; not globally unique.",
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Saved simulated result; response follows frozen C8.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RouteResult"
                }
              }
            }
          },
          "404": {
            "description": "No exact result_id exists in the registered A09 revision-3 artifact; duplicate matches fail closed."
          }
        }
      }
    },
    "/replay-alerts/{event_id}": {
      "get": {
        "operationId": "getB13ReplayObservation",
        "summary": "Read the uniquely selected date-only POONDI replay observation and separate derived-output status",
        "description": "C4 v2 / CR-012, conditional CR-011 route approval. This is a read-only, test-scoped exact lookup of the B28-identified source observation and the result of the approved B19 replay processing. It returns the source observation separately from an optional derived alert; a derived alert is replay-derived and not historically observed. Only the exact approved POONDI source selector is eligible. Historical measurement-time meaning and timezone remain unknown. No flood-depth result is produced by this Track B rule path. The route is not mounted by this projection review; current runtime status is unexposed until B27 passes. Runtime update 2026-11-10 (G5/CR-020 closeout, item 8): mounted in the local B11 package (B27 2d14e13). B13 (d68aa15) received 200 through nginx /api/ai/replay-alerts/replay:POONDI:date:2015-12-01. This route is the optional secondary check under CR-020, not the G5 path.",
        "x-contract-version": "C4-v2",
        "x-change-request": "CR-012",
        "x-current-runtime-status": 200,
        "x-source-mode": "REPLAY",
        "parameters": [
          {
            "name": "event_id",
            "in": "path",
            "required": true,
            "description": "Exact date-only event selector. The sole approved fixture is replay:POONDI:date:2015-12-01; a well-formed but absent selector returns 404.",
            "schema": {
              "type": "string",
              "pattern": "^replay:[A-Z]+:date:[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Exact source observation with C3 date-only semantics, deterministic replay identity, and an explicit produced/not_produced derived-output state.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayObservationResult"
                }
              }
            }
          },
          "400": {
            "description": "Malformed or invalid selector/input.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayLookupError"
                }
              }
            }
          },
          "404": {
            "description": "No exact matching source observation/replay identity exists.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayLookupError"
                }
              }
            }
          },
          "409": {
            "description": "More than one record matches the exact identity; no result is returned.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayLookupError"
                }
              }
            }
          },
          "503": {
            "description": "Source, context, configuration, or derived asset is missing, unreadable, unavailable, or fails SHA-256 verification; no partial result is returned.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReplayLookupError"
                }
              }
            }
          }
        },
        "x-runtime-availability": "available_in_local_B11_package"
      }
    }
  },
  "components": {
    "schemas": {
      "TwinState": {
        "type": "object",
        "required": [
          "run_id",
          "valid_at",
          "version_key",
          "state_artifacts"
        ],
        "properties": {
          "run_id": {
            "type": "integer"
          },
          "valid_at": {
            "type": "string",
            "format": "date-time"
          },
          "version_key": {
            "type": "string"
          },
          "state_artifacts": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "provenance": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "ScenarioCreate": {
        "type": "object",
        "required": [
          "scenario_key",
          "title",
          "base_run_id",
          "parameters"
        ],
        "properties": {
          "scenario_key": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "base_run_id": {
            "type": "integer"
          },
          "parameters": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "Scenario": {
        "allOf": [
          {
            "$ref": "#/components/schemas/ScenarioCreate"
          },
          {
            "type": "object",
            "properties": {
              "status": {
                "type": "string",
                "enum": [
                  "DRAFT",
                  "READY",
                  "RUNNING",
                  "COMPLETE",
                  "FAILED"
                ]
              }
            }
          }
        ]
      },
      "RouteRequest": {
        "additionalProperties": true,
        "properties": {
          "run_id": {
            "title": "Run Id",
            "type": "integer"
          },
          "departure_at": {
            "format": "date-time",
            "title": "Departure At",
            "type": "string"
          },
          "origin": {
            "title": "Origin",
            "type": "string"
          },
          "destination": {
            "title": "Destination",
            "type": "string"
          },
          "mode": {
            "anyOf": [
              {
                "enum": [
                  "vehicle",
                  "walking"
                ],
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Mode"
          },
          "minimum_accessibility_probability": {
            "anyOf": [
              {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Minimum Accessibility Probability"
          }
        },
        "required": [
          "run_id",
          "departure_at",
          "origin",
          "destination"
        ],
        "title": "RouteRequest",
        "type": "object",
        "description": "B15 Java DTO projection for the route request fields and optional probability threshold."
      },
      "RouteResult": {
        "additionalProperties": true,
        "properties": {
          "schema_id": {
            "const": "twinguard.route_result",
            "title": "Schema Id",
            "type": "string"
          },
          "schema_version": {
            "title": "Schema Version",
            "type": "string"
          },
          "result_id": {
            "title": "Result Id",
            "type": "string"
          },
          "status": {
            "$ref": "#/components/schemas/RouteRouteStatus"
          },
          "run_id": {
            "anyOf": [
              {
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "title": "Run Id"
          },
          "scenario_key": {
            "title": "Scenario Key",
            "type": "string"
          },
          "source_mode": {
            "enum": [
              "OBSERVED",
              "DERIVED",
              "SIMULATED",
              "ASSUMPTION",
              "REPLAY"
            ],
            "title": "Source Mode",
            "type": "string"
          },
          "method": {
            "enum": [
              "static",
              "current_flood_aware",
              "horizon_aware",
              "uncertainty_aware"
            ],
            "title": "Method",
            "type": "string"
          },
          "origin_id": {
            "title": "Origin Id",
            "type": "string"
          },
          "destination_id": {
            "title": "Destination Id",
            "type": "string"
          },
          "travel_mode": {
            "enum": [
              "vehicle",
              "walking"
            ],
            "title": "Travel Mode",
            "type": "string"
          },
          "departure_at_utc": {
            "format": "date-time",
            "title": "Departure At Utc",
            "type": "string"
          },
          "arrival_at_utc": {
            "anyOf": [
              {
                "format": "date-time",
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Arrival At Utc"
          },
          "requested_horizon_seconds": {
            "anyOf": [
              {
                "minimum": 0,
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Requested Horizon Seconds"
          },
          "distance_m": {
            "anyOf": [
              {
                "minimum": 0,
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Distance M"
          },
          "travel_time_seconds": {
            "anyOf": [
              {
                "minimum": 0,
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Travel Time Seconds"
          },
          "topologically_reachable": {
            "anyOf": [
              {
                "type": "boolean"
              },
              {
                "type": "null"
              }
            ],
            "title": "Topologically Reachable"
          },
          "route_accessibility_probability": {
            "anyOf": [
              {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Route Accessibility Probability"
          },
          "route_failure_probability": {
            "anyOf": [
              {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Route Failure Probability"
          },
          "minimum_accessibility_probability": {
            "anyOf": [
              {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Minimum Accessibility Probability"
          },
          "route_geometry": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Route Geometry"
          },
          "node_path": {
            "items": {
              "type": "integer"
            },
            "title": "Node Path",
            "type": "array"
          },
          "edges": {
            "items": {
              "$ref": "#/components/schemas/RouteRouteEdge"
            },
            "title": "Edges",
            "type": "array"
          },
          "depth_thresholds": {
            "$ref": "#/components/schemas/RouteRouteThresholds"
          },
          "edge_coverage": {
            "$ref": "#/components/schemas/RouteRouteEdgeCoverage"
          },
          "graph": {
            "$ref": "#/components/schemas/RouteRouteGraph"
          },
          "hazard_run": {
            "$ref": "#/components/schemas/RouteRouteHazardRun"
          },
          "uncertainty": {
            "$ref": "#/components/schemas/RouteRouteUncertainty"
          },
          "provenance": {
            "$ref": "#/components/schemas/RouteRouteResultProvenance"
          },
          "qc_flags": {
            "items": {
              "type": "string"
            },
            "title": "Qc Flags",
            "type": "array"
          }
        },
        "required": [
          "schema_id",
          "schema_version",
          "result_id",
          "status",
          "run_id",
          "scenario_key",
          "source_mode",
          "method",
          "origin_id",
          "destination_id",
          "travel_mode",
          "departure_at_utc",
          "arrival_at_utc",
          "topologically_reachable",
          "route_geometry",
          "node_path",
          "edges",
          "depth_thresholds",
          "edge_coverage",
          "graph",
          "hazard_run",
          "uncertainty",
          "provenance",
          "qc_flags"
        ],
        "title": "RouteResponse",
        "type": "object",
        "description": "B15 Java DTO projection for A09 revision 3. Topological reachability is distinct from flood accessibility; no safety/live claim."
      },
      "Alert": {
        "type": "object",
        "required": [
          "alert_id",
          "severity",
          "issued_at",
          "valid_from",
          "valid_to"
        ],
        "properties": {
          "alert_id": {
            "type": "integer"
          },
