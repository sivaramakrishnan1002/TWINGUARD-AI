{
  "openapi": "3.1.0",
  "info": {"title": "TwinGuard Backend API", "version": "0.1.0", "description": "Design-only contract for application-facing twin state, scenarios, routes, alerts and shelters. Not implemented yet."},
  "paths": {
    "/twin/state": {"get": {"operationId": "getTwinState", "summary": "Read the latest or requested twin state", "parameters": [{"name": "at", "in": "query", "required": false, "schema": {"type": "string", "format": "date-time"}}, {"name": "run_id", "in": "query", "required": false, "schema": {"type": "integer"}}], "responses": {"200": {"description": "Twin state reference and metadata", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TwinState"}}}}, "404": {"description": "State unavailable"}}}},
    "/scenarios": {"get": {"operationId": "listScenarios", "summary": "List saved scenarios", "responses": {"200": {"description": "Scenario list", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Scenario"}}}}}}}, "post": {"operationId": "createScenario", "summary": "Create a scenario", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ScenarioCreate"}}}}, "responses": {"201": {"description": "Scenario created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Scenario"}}}}, "422": {"description": "Invalid scenario"}}}},
    "/scenarios/{scenario_key}": {"get": {"operationId": "getScenario", "summary": "Read a saved scenario", "parameters": [{"name": "scenario_key", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Scenario", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Scenario"}}}}, "404": {"description": "Scenario not found"}}}},
    "/routes": {"post": {"operationId": "requestRoute", "summary": "Request a route for a twin run", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RouteRequest"}}}}, "responses": {"200": {"description": "Route result", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RouteResult"}}}}, "422": {"description": "Invalid route request"}}}},
    "/alerts": {"get": {"operationId": "listAlerts", "summary": "List alerts in a requested time range", "parameters": [{"name": "from", "in": "query", "required": true, "schema": {"type": "string", "format": "date-time"}}, {"name": "to", "in": "query", "required": true, "schema": {"type": "string", "format": "date-time"}}], "responses": {"200": {"description": "Alert list", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Alert"}}}}}}}},
    "/shelters": {"get": {"operationId": "listShelters", "summary": "List shelter and candidate-shelter states", "parameters": [{"name": "at", "in": "query", "required": false, "schema": {"type": "string", "format": "date-time"}}, {"name": "run_id", "in": "query", "required": false, "schema": {"type": "integer"}}], "responses": {"200": {"description": "Shelters and candidate status", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Shelter"}}}}}}}}
  },
  "components": {"schemas": {
    "TwinState": {"type": "object", "required": ["run_id", "valid_at", "version_key", "state_artifacts"], "properties": {"run_id": {"type": "integer"}, "valid_at": {"type": "string", "format": "date-time"}, "version_key": {"type": "string"}, "state_artifacts": {"type": "array", "items": {"type": "string"}}, "provenance": {"type": "object", "additionalProperties": true}}},
    "ScenarioCreate": {"type": "object", "required": ["scenario_key", "title", "base_run_id", "parameters"], "properties": {"scenario_key": {"type": "string"}, "title": {"type": "string"}, "base_run_id": {"type": "integer"}, "parameters": {"type": "object", "additionalProperties": true}}},
    "Scenario": {"allOf": [{"$ref": "#/components/schemas/ScenarioCreate"}, {"type": "object", "properties": {"status": {"type": "string", "enum": ["DRAFT", "READY", "RUNNING", "COMPLETE", "FAILED"]}}}]},
    "RouteRequest": {"type": "object", "required": ["run_id", "departure_at", "origin", "destination"], "properties": {"run_id": {"type": "integer"}, "departure_at": {"type": "string", "format": "date-time"}, "origin": {"type": "string"}, "destination": {"type": "string"}, "mode": {"type": "string", "enum": ["vehicle", "walking"]}}},
    "RouteResult": {"type": "object", "required": ["reachable", "edge_ids", "provenance"], "properties": {"reachable": {"type": "boolean"}, "edge_ids": {"type": "array", "items": {"type": "integer"}}, "travel_time_minutes": {"type": "number", "minimum": 0}, "provenance": {"type": "object", "additionalProperties": true}}},
    "Alert": {"type": "object", "required": ["alert_id", "severity", "issued_at", "valid_from", "valid_to"], "properties": {"alert_id": {"type": "integer"}, "severity": {"type": "string", "enum": ["INFO", "WATCH", "WARNING", "EMERGENCY"]}, "issued_at": {"type": "string", "format": "date-time"}, "valid_from": {"type": "string", "format": "date-time"}, "valid_to": {"type": "string", "format": "date-time"}, "provenance": {"type": "object", "additionalProperties": true}}},
    "Shelter": {"type": "object", "required": ["facility_id", "category", "candidate_only"], "properties": {"facility_id": {"type": "integer"}, "name": {"type": "string"}, "category": {"type": "string"}, "candidate_only": {"type": "boolean"}, "capacity_people": {"type": ["integer", "null"], "minimum": 0}, "accessibility_probability": {"type": ["number", "null"], "minimum": 0, "maximum": 1}}
  }}}
}
