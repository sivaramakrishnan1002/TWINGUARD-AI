server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # B48 performance: compress text assets; hashed assets are immutable, Cesium statics change only on upgrade.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml application/wasm;
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /cesium/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # C4 v3 (CR-019): simulation/route/resource writes go only to /v3.
    location /api/ai/v3/ {
        limit_except GET POST PUT { deny all; }
        client_max_body_size 64k;
        proxy_pass http://ai-service:8000/v3/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store" always;
    }

    # CR-018: same-origin read-only proxy to the packaged AI service.
    location /api/ai/ {
        limit_except GET { deny all; }
        proxy_pass http://ai-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
